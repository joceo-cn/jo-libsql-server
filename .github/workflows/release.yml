name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    name: Build Linux (x64 Full Static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Static Libraries
        run: |
          sudo apt-get update
          # 安装 glibc 静态库和基础开发环境，对齐本地环境
          sudo apt-get install -y libc6-dev build-essential
      - name: Build Binary
        env:
          CGO_ENABLED: 1
        run: |
          # 使用标准 GCC 的全静态链接模式，产出 26MB 级别的全功能二进制文件
          go build -mod=vendor -ldflags "-linkmode external -extldflags '-static' -s -w" -o jo-libsql-server-linux-amd64 main.go
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jo-libsql-server-linux-amd64
          path: jo-libsql-server-linux-amd64

  build-linux-arm64:
    name: Build Linux (ARM64 Full Static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build Binary
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
        run: |
          go build -mod=vendor -ldflags "-linkmode external -extldflags '-static' -s -w" -o jo-libsql-server-linux-arm64 main.go
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jo-libsql-server-linux-arm64
          path: jo-libsql-server-linux-arm64

  build-macos-arm64:
    name: Build macOS (ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Binary
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 1
        run: |
          go build -mod=vendor -ldflags "-s -w" -o jo-libsql-server-darwin-arm64 main.go
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jo-libsql-server-darwin-arm64
          path: jo-libsql-server-darwin-arm64

  release:
    name: Create Release
    needs: [build-linux-x64, build-linux-arm64, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jo-libsql-server-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
